services:
  web:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npx next dev -H 0.0.0.0 -p 3000"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
