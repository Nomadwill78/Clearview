# Deploy Celestial's Supabase edge functions (AI readings, Stripe checkout/webhook)
name: Deploy Supabase Functions

on:
  push:
    branches: ["main"]
    paths:
      - "Celestial/supabase/functions/**"
      - "Celestial/supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        working-directory: Celestial
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref rjucvqthsseegxlwryru
